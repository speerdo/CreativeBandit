<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Creative Bandit">
  <!--
    Favicon build of the mascot. Deliberately cruder than
    /mascot/bandit-cat.svg: no halftone, whiskers, badge ring or crop marks,
    because none of that survives at 16px. The read is orange hat, bone face,
    blue bandana, and nothing else.
  -->
  <rect width="64" height="64" rx="6" fill="#0B0B0C"/>

  <!-- Ears -->
  <path d="M 15 30 L 18 11 L 31 25 Z" fill="#EDE8DF"/>
  <path d="M 49 30 L 46 11 L 33 25 Z" fill="#EDE8DF"/>
  <path d="M 19 28 L 21 17 L 28 25 Z" fill="#E5195A"/>
  <path d="M 45 28 L 43 17 L 36 25 Z" fill="#E5195A"/>

  <!-- Head -->
  <ellipse cx="32" cy="37" rx="16" ry="15" fill="#EDE8DF"/>

  <!-- Eyes -->
  <ellipse cx="26" cy="34" rx="3.4" ry="2.8" fill="#0B0B0C"/>
  <ellipse cx="38" cy="34" rx="3.4" ry="2.8" fill="#0B0B0C"/>

  <!-- Bandana -->
  <path d="M 17 40 Q 32 44 47 40 L 48 44 Q 40 55 32 57 Q 24 55 16 44 Z" fill="#1B27E8"/>

  <!-- Hat: brim then crown, sitting clear of the eyes -->
  <ellipse cx="32" cy="25" rx="25" ry="5" fill="#FF4D14"/>
  <path d="M 24 25 Q 23 14 28 11 Q 32 9 36 11 Q 41 14 40 25 Z" fill="#FF4D14"/>
  <rect x="24" y="21" width="16" height="3" fill="#0B0B0C" opacity="0.85"/>
  <rect x="36" y="20.5" width="3" height="4" fill="#D9F24A"/>
</svg>
